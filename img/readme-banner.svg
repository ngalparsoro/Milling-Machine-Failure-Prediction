<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <!-- dark bg -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#070A0D"/>
      <stop offset="100%" stop-color="#0D1218"/>
    </linearGradient>
    <!-- rust slash -->
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C0390A"/>
      <stop offset="100%" stop-color="#E84A0A"/>
    </linearGradient>
    <!-- right glow -->
    <radialGradient id="glow" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#E84A0A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070A0D" stop-opacity="0"/>
    </radialGradient>
    <!-- left fade for text readability -->
    <linearGradient id="textfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#070A0D" stop-opacity="1"/>
      <stop offset="65%" stop-color="#070A0D" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#070A0D" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="roundclip">
      <rect width="900" height="300" rx="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundclip)">

    <!-- base background -->
    <rect width="900" height="300" fill="url(#bg)"/>

    <!-- metal grid -->
    <g opacity="0.045" stroke="#E84A0A" stroke-width="1">
      <!-- vertical lines -->
      <line x1="48"  y1="0" x2="48"  y2="300"/>
      <line x1="96"  y1="0" x2="96"  y2="300"/>
      <line x1="144" y1="0" x2="144" y2="300"/>
      <line x1="192" y1="0" x2="192" y2="300"/>
      <line x1="240" y1="0" x2="240" y2="300"/>
      <line x1="288" y1="0" x2="288" y2="300"/>
      <line x1="336" y1="0" x2="336" y2="300"/>
      <line x1="384" y1="0" x2="384" y2="300"/>
      <line x1="432" y1="0" x2="432" y2="300"/>
      <line x1="480" y1="0" x2="480" y2="300"/>
      <line x1="528" y1="0" x2="528" y2="300"/>
      <line x1="576" y1="0" x2="576" y2="300"/>
      <line x1="624" y1="0" x2="624" y2="300"/>
      <line x1="672" y1="0" x2="672" y2="300"/>
      <line x1="720" y1="0" x2="720" y2="300"/>
      <line x1="768" y1="0" x2="768" y2="300"/>
      <line x1="816" y1="0" x2="816" y2="300"/>
      <line x1="864" y1="0" x2="864" y2="300"/>
      <!-- horizontal lines -->
      <line x1="0" y1="48"  x2="900" y2="48"/>
      <line x1="0" y1="96"  x2="900" y2="96"/>
      <line x1="0" y1="144" x2="900" y2="144"/>
      <line x1="0" y1="192" x2="900" y2="192"/>
      <line x1="0" y1="240" x2="900" y2="240"/>
      <line x1="0" y1="288" x2="900" y2="288"/>
    </g>

    <!-- diagonal rust slash left -->
    <polygon points="0,0 320,0 260,300 0,300" fill="url(#slash)" opacity="0.10"/>
    <!-- left red border line -->
    <rect x="0" y="0" width="5" height="300" fill="#C0390A"/>

    <!-- right orange glow -->
    <rect width="900" height="300" fill="url(#glow)"/>

    <!-- photo right side -->
    <defs>
      <linearGradient id="photomask" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="white" stop-opacity="0"/>
        <stop offset="30%"  stop-color="white" stop-opacity="0.55"/>
        <stop offset="65%"  stop-color="white" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="white" stop-opacity="1"/>
      </linearGradient>
      <mask id="imgfade">
        <rect x="380" y="0" width="520" height="300" fill="url(#photomask)"/>
      </mask>
    </defs>
    <image href="hero-machine.jpg" x="300" y="60" width="650" height="420"
      preserveAspectRatio="xMidYMax slice" mask="url(#imgfade)" opacity="0.85"/>

    <!-- ── TEXT CONTENT ── -->
    <!-- eyebrow -->
    <g transform="translate(52,46)">
      <rect width="16" height="1.5" fill="#E84A0A"/>
      <text x="24" y="1" font-size="8.5" font-weight="700" fill="#E84A0A" letter-spacing="2.5" text-anchor="start" dominant-baseline="middle">PROYECTO ML · BOOTCAMP DATA SCIENCE</text>
    </g>

    <!-- main title line 1 -->
    <text x="52" y="106" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="-0.5" text-anchor="start">PREDICCIÓN DE</text>
    <!-- main title line 2 highlighted -->
    <text x="52" y="146" font-size="32" font-weight="900" fill="#E84A0A" letter-spacing="-0.5" text-anchor="start">PARADA</text>
    <text x="200" y="146" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="-0.5" text-anchor="start"> DE MÁQUINA</text>

    <!-- divider line -->
    <rect x="52" y="162" width="320" height="1.5" fill="#C0390A" opacity="0.4"/>

    <!-- description -->
    <text x="52" y="182" font-size="11" fill="#60737F" letter-spacing="0.2">Mantenimiento predictivo industrial · Clasificación binaria sobre señales de sensores</text>

    <!-- stats -->
    <g transform="translate(52,224)">
      <!-- stat 1 -->
      <text x="0"   y="0" font-size="15" font-weight="900" fill="#E84A0A" letter-spacing="-0.5">10K</text>
      <text x="0"   y="13" font-size="8.5" font-weight="700" fill="#60737F" letter-spacing="1">REGISTROS</text>
      <!-- divider -->
      <line x1="58" y1="-12" x2="58" y2="16" stroke="#1E2530" stroke-width="1"/>
      <!-- stat 2 -->
      <text x="68"  y="0" font-size="15" font-weight="900" fill="#E84A0A" letter-spacing="-0.5">3.4%</text>
      <text x="68"  y="13" font-size="8.5" font-weight="700" fill="#60737F" letter-spacing="1">TASA FALLO</text>
      <!-- divider -->
      <line x1="142" y1="-12" x2="142" y2="16" stroke="#1E2530" stroke-width="1"/>
      <!-- stat 3 -->
      <text x="152" y="0" font-size="15" font-weight="900" fill="#E84A0A" letter-spacing="-0.5">5</text>
      <text x="152" y="13" font-size="8.5" font-weight="700" fill="#60737F" letter-spacing="1">MODOS FALLO</text>
    </g>

    <!-- bottom border -->
    <rect x="0" y="296" width="900" height="4" fill="url(#slash)" opacity="0.8"/>

  </g>
</svg>
