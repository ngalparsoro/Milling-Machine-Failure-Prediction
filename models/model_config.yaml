model:
  name: StackingClassifier
  type: ensemble
  base_learners:
  - LGBMClassifier
  - RandomForestClassifier
  meta_model: LogisticRegression
  cv_folds: 5
threshold: 0.9858
features:
- Type_enc
- Air temperature [K]
- Process temperature [K]
- Rotational speed [rpm]
- Torque [Nm]
- Tool wear [min]
- Power [W]
- Temp_diff [K]
- Wear_torque
- wear_ratio
n_features: 10
hyperparameters:
  lgbm:
    colsample_bytree: 0.7183
    learning_rate: 0.03
    min_child_samples: 32
    n_estimators: 127
    num_leaves: 63
    reg_alpha: 0.4165
    reg_lambda: 0.8833
    subsample: 0.6488
    scale_pos_weight: 42.78
    random_state: 42
    verbose: -1
  rf:
    n_estimators: 418
    max_depth: 18
    min_samples_split: 5
    min_samples_leaf: 2
    max_features: 0.3
    class_weight: balanced_subsample
    random_state: 42
    n_jobs: -1
training:
  dataset: AI4I 2020 Predictive Maintenance (UCI)
  n_train: 8000
  n_test: 2000
  class_imbalance: 3.4% failures
  split_strategy: StratifiedShuffleSplit(test_size=0.2, random_state=42)
  scaling: StandardScaler
performance:
  precision: 0.9667
  recall: 0.8529
  f1: 0.9062
  roc_auc: 0.9783
  fn: 10
  fp: 2
target: Machine failure (1=fallo, 0=normal)
optimization_metric: Recall >= 0.85, maximize F1
