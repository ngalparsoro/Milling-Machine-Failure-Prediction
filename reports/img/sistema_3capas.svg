  <path id="arcRB" d="M 985,560 A 80,80 0 0 1 1145,560" fill="none"/>
</defs>

<rect width="1280" height="854" fill="url(#bg)"/>

<!-- ░░ faint circuit-board traces (background) ░░ -->
