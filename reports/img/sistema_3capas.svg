<svg viewBox="0 0 1280 854" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="75%">
    <stop offset="0%" stop-color="#0E141C"/>
    <stop offset="60%" stop-color="#080B11"/>
    <stop offset="100%" stop-color="#05070A"/>
  </radialGradient>
  <linearGradient id="blueG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5BB4FF"/><stop offset="100%" stop-color="#1E6FD0"/>
  </linearGradient>
  <linearGradient id="orangeG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F2A33C"/><stop offset="100%" stop-color="#C24310"/>
  </linearGradient>
  <linearGradient id="violetG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#C77BFF"/><stop offset="100%" stop-color="#7E3CCB"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
