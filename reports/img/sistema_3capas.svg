  <circle cx="880" cy="190" r="3"/><circle cx="860" cy="670" r="3"/>
  <circle cx="760" cy="760" r="3"/><circle cx="300" cy="740" r="3"/>
</g>

<!-- ░░ connecting traces between modules ░░ -->
